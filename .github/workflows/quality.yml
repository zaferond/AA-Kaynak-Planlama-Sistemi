name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run verify
      - run: npm run deploy:verify
      - run: npx playwright install --with-deps chromium
      - name: Browser security and draft regression checks (synthetic database)
        run: node scripts/run-browser-checks.mjs
      - run: npm audit --audit-level=high
      - run: npm --prefix frontend audit --audit-level=high
  windows-synthetic:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - name: Shared domain, TypeScript and site build on Windows
        run: npm run check:domain && npm run build && npm run deploy:verify
        shell: cmd
      - name: Synthetic sessions, file locks, recovery, rollback, restart and concurrency
        run: node --test tests/config.test.mjs tests/http-config.test.mjs tests/proxy-transport.test.mjs tests/sqljs.test.mjs tests/concurrency.test.mjs tests/restore.test.mjs tests/recovery-acceptance.test.mjs tests/storage-order.test.mjs tests/data-response.test.mjs tests/login-security.test.mjs tests/xlsx-workbook.test.mjs tests/xlsx-cell-limits.test.mjs tests/xlsx-xml-characters.test.mjs tests/domain-boundaries.test.mjs tests/risk-systems.test.mjs tests/record-access-http.test.mjs tests/startup-tools.test.mjs tests/deployment-manifest.test.mjs tests/dependency-security.test.mjs tests/transaction-profile.test.mjs tests/planning-snapshot.test.mjs tests/mutation-snapshot.test.mjs tests/snapshot-metadata.test.mjs tests/mssql-batch.test.mjs tests/windows-launcher.integration.mjs
